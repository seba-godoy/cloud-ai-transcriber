name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator
      - name: Firestore emulator integration test
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          set -euo pipefail
          gcloud emulators firestore start --host-port=127.0.0.1:8080 --quiet > /tmp/firestore-emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if python -c 'import socket; socket.create_connection(("127.0.0.1", 8080), timeout=1).close()' 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Firestore emulator exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "Firestore emulator did not start within 60 seconds"
            cat /tmp/firestore-emulator.log
            exit 1
          fi
          timeout 180s python -m unittest tests.test_firestore_emulator -v
      - name: Build transcription container
        run: docker build .
      - name: Build dashboard container
        run: docker build -f dashboard/Dockerfile .
