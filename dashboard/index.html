<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Bot Transcriptor</title>
  <style>
    :root{color-scheme:dark;--bg:#080b14;--panel:#111827;--panel2:#172033;--line:#27344b;--text:#f6f7fb;--muted:#9aa7bd;--accent:#79a8ff;--ok:#48d597;--bad:#ff7474}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16213a 0,#080b14 38%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    main{max-width:960px;margin:auto;padding:24px 16px 48px}.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
    h1{font-size:clamp(25px,5vw,38px);margin:5px 0 0}.subtitle{color:var(--muted);margin-top:4px}.controls{display:flex;gap:10px;align-items:center}
    select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}
    .badge{display:inline-block;font-size:12px;color:var(--ok);border:1px solid #245c4a;background:#0e2d27;padding:5px 9px;border-radius:999px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.job,.empty{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0004}.card{padding:16px}.card strong{display:block;font-size:27px}.card span{color:var(--muted);font-size:13px}
    .section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:24px 0 10px}.section-head h2{font-size:18px;margin:0}.small{font-size:12px;color:var(--muted)}
    #jobs{display:grid;gap:11px}.job{padding:15px}.job-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.job-name{font-weight:650;overflow-wrap:anywhere}.job-id{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
    .status{white-space:nowrap;border-radius:999px;padding:4px 8px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 0}
    .progress{height:7px;border-radius:999px;background:#222d40;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#5588ff,#72d4ff);border-radius:inherit}.error{color:#ffc0c0;font-size:12px;margin-top:8px}
    .empty{padding:32px;text-align:center;color:var(--muted)}.error-box{background:#34191d;border:1px solid #71303a;color:#ffd4d8;padding:14px;border-radius:14px}footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:stretch}.controls{width:100%}.controls select{flex:1}.job-top{flex-direction:column}.status{align-self:flex-start}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <div class="badge">● Solo lectura</div>
      <h1>Bot Transcriptor</h1>
      <div class="subtitle">Progreso e historial por usuario</div>
    </div>
    <div class="controls">
      <select id="user" aria-label="Usuario">
        <option value="primary">Primary</option>
        <option value="secondary">Secondary</option>
      </select>
      <button id="refresh" type="button">Actualizar</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><strong id="completed">—</strong><span>Completados</span></div>
    <div class="card"><strong id="progressing">—</strong><span>Procesando</span></div>
    <div class="card"><strong id="retryable">—</strong><span>Reintentables</span></div>
    <div class="card"><strong id="failed">—</strong><span>Fallidos</span></div>
  </div>

  <div class="section-head">
    <h2 id="title">Trabajos de Primary</h2>
    <div class="small" id="updated">Cargando…</div>
  </div>
  <div id="jobs"><div class="empty">Cargando trabajos…</div></div>
  <footer>Datos desde Firestore · la interfaz no modifica trabajos.</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const labels={completed:"Completado",in_progress:"Procesando",retryable:"Reintentable",failed_permanent:"Fallido"};
const icons={completed:"✅",in_progress:"⏳",retryable:"🔁",failed_permanent:"❌"};
const userSelect=$("user");
function fmtTime(value){if(!value)return"Sin fecha";const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"})}
function esc(value){const d=document.createElement("div");d.textContent=value??"";return d.innerHTML}
function render(data){
  $("completed").textContent=data.summary.completed;$("progressing").textContent=data.summary.in_progress;$("retryable").textContent=data.summary.retryable;$("failed").textContent=data.summary.failed_permanent;
  $("title").textContent=`Trabajos de ${data.user.name}`;$("updated").textContent=`Actualizado ${fmtTime(data.generated_at)}`;
  if(!data.jobs.length){$("jobs").innerHTML=`<div class="empty">${data.user.name} todavía no tiene trabajos asignados.</div>`;return}
  $("jobs").innerHTML=data.jobs.map(job=>{const chunks=job.total_chunks?` · ${job.completed_chunks}/${job.total_chunks} bloques`:"";const err=job.error?`<div class="error">${esc(job.error)}</div>`:"";return `<article class="job"><div class="job-top"><div><div class="job-name">${esc(job.name)}</div><div class="job-id">ID ${esc(job.id)}</div></div><div class="status">${icons[job.status]||"•"} ${labels[job.status]||esc(job.status)}</div></div><div class="meta"><span>${esc(job.source)}</span><span>${fmtTime(job.updated_at)}</span><span>${job.progress_pct}%${chunks}</span></div><div class="progress" aria-label="Progreso"><i style="width:${job.progress_pct}%"></i></div>${err}</article>`}).join("");
}
async function load(){
  $("jobs").innerHTML='<div class="empty">Actualizando…</div>';
  try{const r=await fetch(`/api/jobs?user=${encodeURIComponent(userSelect.value)}`,{cache:"no-store"});const data=await r.json();if(!r.ok)throw new Error(data.error||"No se pudo cargar");render(data)}catch(e){$("jobs").innerHTML=`<div class="error-box">${esc(e.message)}</div>`;$("updated").textContent="Error al actualizar"}
}
userSelect.addEventListener("change",load);$("refresh").addEventListener("click",load);load();setInterval(load,30000);
</script>
</body>
</html>
